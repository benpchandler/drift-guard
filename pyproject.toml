[project]
name = "drift-guard"
version = "0.1.0"
description = "Session-intent drift guard for Claude Code, judged by Jev"
readme = "README.md"
authors = [
    { name = "Ben Chandler", email = "benpchandler@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "typesafe-sdk>=0.7.1",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[project.scripts]
drift = "drift_guard.cli:main"

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "RUF", "PL"]
ignore = ["PLR2004", "PLR0913", "PLC0415"]

[tool.mypy]
strict = true
